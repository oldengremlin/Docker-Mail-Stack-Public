# ─────────────────────────────────────────────────────────────────────
#  OpenDMARC — СТАТИЧНА частина конфігу групи.
#
#  Entrypoint копіює цей файл у /etc/opendmarc.conf і ДОПИСУЄ в кінець
#  те, що залежить від env (AuthservID, TrustedAuthservIDs). Нічого з
#  дописаного тут не задавати — при конкатенації перемагає останнє
#  значення, тобто дубль розійшовся б мовчки.
#
#  Рішення №10: другий мілтер у ланцюзі, ПІСЛЯ OpenDKIM. Порядок не
#  косметичний — OpenDMARC сам DKIM не перевіряє, він читає заголовок
#  Authentication-Results, який ставить OpenDKIM. Поставити його першим
#  означало б оцінювати DMARC без результату DKIM, тобто завжди лише
#  по SPF.
# ─────────────────────────────────────────────────────────────────────

# ── Сокет ─────────────────────────────────────────────────────────────
# НЕ localhost: Postfix в іншому контейнері й ходить сюди за іменем
# `opendmarc` (у main.cf — inet:opendmarc:8893).
Socket                  inet:8893

UserID                  opendmarc

# Syslog УВІМКНЕНИЙ, хоч syslog-а в контейнері немає: entrypoint
# піднімає злив /dev/log у stderr. Без цього діагностики DMARC не
# існувало б — як не існувало її в OpenDKIM, поки не помітили.
Syslog                  true

# ── Чию пошту НЕ оцінювати ────────────────────────────────────────────
# Пошта наших же користувачів через DMARC не проходить, і це правильно:
# DMARC — про те, чи має право ЦЕЙ сервер відправляти від ТОГО домену.
# Для автентикованого користувача відповідь дає авторизація, а не SPF
# чужого домену. Без цього рядка співробітник, який шле з адреси в
# домені, чий DMARC суворий, отримав би відмову від власного сервера.
IgnoreAuthenticatedClients true

# Хости, від яких не оцінюємо взагалі — файл генерує entrypoint із
# internal-мережі групи й MYNETWORKS. Та сама логіка, що в
# InternalHosts у OpenDKIM.
IgnoreHosts             /etc/opendmarc/ignore.hosts

# ── SPF ───────────────────────────────────────────────────────────────
#  ╔═══════════════════════════════════════════════════════════════════╗
#  ║ Окремого SPF-мілтера в стеку немає, тож SPF-результат OpenDMARC    ║
#  ║ мусить здобути сам. Для цього потрібно, щоб пакет був ЗІБРАНИЙ з  ║
#  ║ підтримкою SPF — перевіряється `opendmarc -n` на образі, і якщо    ║
#  ║ параметр невідомий, вилізе так само, як вилізло `MTAs` у OpenDKIM. ║
#  ║                                                                   ║
#  ║ Якщо збірка без SPF — варіанти два: або ставити окремий            ║
#  ║ policy-сервіс SPF перед мілтерами, або лишити DMARC лише на DKIM  ║
#  ║ (тоді `dmarc=pass` вимагатиме саме валідного підпису, що строгіше ║
#  ║ за стандарт, бо DMARC проходить і по одному з двох).              ║
#  ╚═══════════════════════════════════════════════════════════════════╝
SPFSelfValidate         true

# ── Що робити з провалом ──────────────────────────────────────────────
#  ╔═══════════════════════════════════════════════════════════════════╗
#  ║ ПЕРШИЙ ЕТАП: тільки МАРКУВАННЯ, без відмов.                        ║
#  ║                                                                   ║
#  ║ Це не боязкість, а порядок із рішення №21: спершу дивимось, що    ║
#  ║ саме провалюється, і лише потім відмовляємо. Причина конкретна —  ║
#  ║ `dmarc=fail` на цьому етапі з однаковою вірогідністю означає і    ║
#  ║ підробку, і нашу ж помилку в налаштуванні SPF/DKIM. Увімкнути     ║
#  ║ відмови одразу означає втрачати пошту через власні недоробки, і   ║
#  ║ дізнатись про це від користувачів.                                ║
#  ║                                                                   ║
#  ║ Перемикати на `true` ПІСЛЯ того, як у заголовках з'явиться         ║
#  ║ статистика: `dmarc=pass` на легітимній пошті від великих           ║
#  ║ відправників, а `fail` — лише там, де справді підробка.           ║
#  ╚═══════════════════════════════════════════════════════════════════╝
RejectFailures          false

# Додавати власний Authentication-Results навіть коли домен не має
# політики DMARC: інакше «перевірка не відбулась» і «політики немає»
# виглядають однаково — ніяк.
AuthservIDWithJobID     false
SoftwareHeader          true

# ── Організаційний домен ──────────────────────────────────────────────
#  ╔═══════════════════════════════════════════════════════════════════╗
#  ║ ОБОВ'ЯЗКОВО, і саме для наших доменів.                            ║
#  ║                                                                   ║
#  ║ DMARC у режимі relaxed вирівнює домен `From` з доменом підпису    ║
#  ║ (чи SPF) до ОРГАНІЗАЦІЙНОГО. Без Public Suffix List OpenDMARC     ║
#  ║ вважає організаційним другий рівень — і для .com.ua, .kiev.ua,    ║
#  ║ .org.ua це просто неправильно: там публічний суфікс сам           ║
#  ║ двоскладовий, а організаційний домен — третього рівня.            ║
#  ║                                                                   ║
#  ║ Ціна помилки конкретна: `example.kiev.ua` звівся б до         ║
#  ║ `kiev.ua`, і тоді ЛЮБИЙ домен у .kiev.ua вважався б вирівняним із ║
#  ║ нашим. Тобто DMARC перестав би робити те єдине, для чого існує.   ║
#  ║                                                                   ║
#  ║ Файл дає пакет `publicsuffix` із Debian, тож оновлюється через    ║
#  ║ apt разом з образом, а не окремим механізмом. Entrypoint          ║
#  ║ перевіряє, що файл на місці, і падає, якщо ні: мовчки втрачене    ║
#  ║ вирівнювання помітити неможливо.                                  ║
#  ╚═══════════════════════════════════════════════════════════════════╝
PublicSuffixList        /usr/share/publicsuffix/public_suffix_list.dat

# ── Чого тут свідомо НЕМА ─────────────────────────────────────────────
#  * History/HistoryFile і агрегатні звіти (rua=). Це окремий механізм:
#    демон пише історію у файл, а звіти вночі збирає окремий скрипт і
#    розсилає. Потрібне, але це не мілтер — див. TODO.
