# ─────────────────────────────────────────────────────────────────────
#  OpenDKIM — СТАТИЧНА частина конфігу групи.
#
#  Entrypoint копіює цей файл у /etc/opendkim.conf і ДОПИСУЄ в кінець
#  те, що залежить від env (AuthservID). Нічого з дописаного тут не
#  задавати — у opendkim.conf немає include, і при конкатенації
#  перемагає останнє значення, тобто дубль розійшовся б мовчки.
#
#  KeyTable, SigningTable і InternalHosts entrypoint генерує з БД і з
#  параметрів групи. Руками їх не правлять: «додати домен» не має
#  ставати четвертою ручною операцією.
# ─────────────────────────────────────────────────────────────────────

# ── Режим ─────────────────────────────────────────────────────────────
# s = підписувати, v = перевіряти. Потрібне й те, й те: підпис на
# вихідній пошті, перевірка на вхідній — без неї OpenDMARC не має на
# чому будувати оцінку (він сам DKIM не перевіряє, а читає
# Authentication-Results від нас).
#
#  ╔═══════════════════════════════════════════════════════════════════╗
#  ║ Перевірено на полігоні: підписується не лише те, що з             ║
#  ║ InternalHosts, а й АВТЕНТИКОВАНИЙ сеанс — навіть на порту 25, де  ║
#  ║ daemon_name дефолтний і під MTA не підпадає. Тобто критерій —     ║
#  ║ «внутрішній АБО автентикований», і клієнтів на 25 нікуди          ║
#  ║ переводити не треба.                                              ║
#  ║                                                                   ║
#  ║ Небезпечне місце НЕ тут, а в InternalHosts для isp-подібної     ║
#  ║ групи: там MYNETWORKS — публічні блоки провайдера, з яких шлють   ║
#  ║ БЕЗ авторизації, і додавати їх до InternalHosts означає роздати   ║
#  ║ підпис домену всім абонентам. Розбір у PITFALLS.                  ║
#  ╚═══════════════════════════════════════════════════════════════════╝
Mode                    sv

# ── Хто ми ────────────────────────────────────────────────────────────
# Syslog УВІМКНЕНИЙ, хоч syslog-а в контейнері немає: entrypoint
# піднімає злив /dev/log у stderr, звідки логи бере `docker logs`.
#
# Раніше тут стояло `Syslog no` разом із `LogWhy yes` — суперечність:
# LogWhy пише саме в syslog, тобто вся діагностика йшла в нікуди. Через
# це DKIM довелось налагоджувати по заголовках листів.
Syslog                  yes
LogWhy                  yes
UserID                  opendkim

# ── Сокет ─────────────────────────────────────────────────────────────
# НЕ localhost: Postfix в іншому контейнері й ходить сюди за іменем
# `opendkim` по internal-мережі (у main.cf — inet:opendkim:8891).
# /etc/default/opendkim у Debian теж задає сокет, але він тут не діє:
# ми запускаємо демон напряму, а не через init-скрипт.
Socket                  inet:8891

# ── Таблиці (генерує entrypoint) ──────────────────────────────────────
# SigningTable саме refile: лише в ньому працює шаблон `*@домен`.
# Звичайний файл шукав би за повною адресою відправника, тобто кожну
# скриньку довелось би перелічувати.
KeyTable                /etc/opendkim/KeyTable
SigningTable            refile:/etc/opendkim/SigningTable
InternalHosts           /etc/opendkim/InternalHosts

# ── Що підписувати й чим ──────────────────────────────────────────────
Canonicalization        relaxed/simple
SignatureAlgorithm      rsa-sha256

# Підписувати пошту, що прийшла з submission, незалежно від адреси
# клієнта: `milter_macro_daemon_name = ORIGINATING` на сервісі
# submission у Postfix віддає сюди саме це ім'я.
#
#  ╔═══════════════════════════════════════════════════════════════════╗
#  ║ Ім'я параметра — `MTA`, ОДНИНА. Перевірено на образі: `MTAs`      ║
#  ║ дає `configuration error: unrecognized parameter`. Я спершу       ║
#  ║ написав множину з других джерел — не повторювати.                 ║
#  ║                                                                   ║
#  ║ Те, що параметр існує, ще не означає, що він дає потрібний        ║
#  ║ ЕФЕКТ. Перевіряється живим тестом: лист через submission має      ║
#  ║ отримати DKIM-Signature. Якщо ні — першоджерело лежить в образі,  ║
#  ║ /usr/share/doc/opendkim/.                                         ║
#  ╚═══════════════════════════════════════════════════════════════════╝
MTA                     ORIGINATING

# ── Заголовок для DMARC ───────────────────────────────────────────────
# Без цього рядка на НЕпідписаному листі Authentication-Results не
# з'являється взагалі — перевірено живим тестом. Для нас це не дрібниця:
# OpenDMARC сам DKIM не перевіряє, він читає саме цей заголовок. Без
# нього він отримав би не «dkim=none», а порожнечу, і оцінка DMARC
# будувалась би лише на SPF — причому мовчки.
#
#  ╔═══════════════════════════════════════════════════════════════════╗
#  ║ Ім'я параметра перевіряється тим самим `opendkim -n`, що вже раз  ║
#  ║ зловив `MTAs`. Якщо впаде — дивитись /usr/share/doc/opendkim/     ║
#  ║ В ОБРАЗІ. Ефект перевіряється наступним же тестом:                ║
#  ║ неавтентикований лист мусить отримати Authentication-Results із   ║
#  ║ dkim=none.                                                        ║
#  ╚═══════════════════════════════════════════════════════════════════╝
AlwaysAddARHeader        yes

# ── Дрібне, але варте ─────────────────────────────────────────────────
# Підписувати навіть якщо заголовка From немає в нашому домені? НІ:
# дефолт і є правильним — підписуємо лише те, що знайшлось у
# SigningTable.
#
# OversignHeaders захищає від підстановки другого From: приймальна
# сторона побачить, що заголовок був підписаний саме один раз.
OversignHeaders         From

# Тимчасова відмова, якщо щось пішло не так усередині мілтера, краща за
# пропуск без підпису: Postfix відкладе лист і спробує ще раз.
# Протилежний вибір (`milter_default_action = accept`) зроблений у
# Postfix СВІДОМО й стосується іншого випадку — коли мілтер узагалі не
# відповідає. Тут же він відповів, але не змог.
On-InternalError        tempfail
On-NoSignature          accept
On-BadSignature         accept
On-KeyNotFound          tempfail
