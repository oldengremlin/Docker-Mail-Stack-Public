# ─────────────────────────────────────────────────────────────────────
#  freshclam — оновлення бази вірусів. Спільний конфіг на всі групи.
# ─────────────────────────────────────────────────────────────────────

# Логи в stdout контейнера.
LogSyslog no
LogTime yes
Foreground yes

DatabaseDirectory /var/lib/clamav
DatabaseOwner clamav
PidFile /run/clamav/freshclam.pid

DatabaseMirror database.clamav.net

# Скільки разів на добу перевіряти оновлення. 12 — пакетний дефолт
# Debian; ClamAV просить не частіше 24.
Checks 12

# ┌───────────────────────────────────────────────────────────────────┐
# │ ВИХІД У МЕРЕЖУ: freshclam — єдиний у стеку, хто сам ініціює       │
# │ з'єднання в інтернет не для пошти. Він піде дефолтним маршрутом   │
# │ групи, тобто з адреси PRIMARY_NET — тією самою, з якої йде        │
# │ вихідна пошта. Це нормально, але варто знати: якщо на хості є nft │
# │ правила на вихідний трафік групи, HTTPS до database.clamav.net    │
# │ мусить бути дозволений, інакше база не оновлюється — і це         │
# │ ВИДНО ЛИШЕ В ЛОГАХ цього контейнера, пошта при цьому ходить.      │
# └───────────────────────────────────────────────────────────────────┘

# Не чекати до посиніння, якщо мережі немає: мілтер однаково працює на
# тій базі, що вже є.
ConnectTimeout 30
ReceiveTimeout 60
