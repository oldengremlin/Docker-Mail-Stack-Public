# ─────────────────────────────────────────────────────────────────────
#  clamd — сканер. Спільний конфіг на всі групи.
#
#  Свій файл, а не пакетний: пакетний генерується dpkg-reconfigure і
#  при оновленні ClamAV у нього приїдуть нові дефолти, які почнуть
#  діяти мовчки. Той самий клас проблеми, через який у нас власний
#  dovecot.conf (рішення №26).
# ─────────────────────────────────────────────────────────────────────

# Логи — у stdout контейнера, не у файл. `LogFile` свідомо не задаємо:
# файл у контейнері нікому не потрібен і лише з'їдає шар.
LogSyslog no
LogVerbose no
LogTime yes
Foreground yes

PidFile /run/clamav/clamd.pid
DatabaseDirectory /var/lib/clamav
User clamav

# ── Як до нас звертається мілтер ──────────────────────────────────────
# TCP на loopback, а не юнікс-сокет. clamav-milter живе в ЦЬОМУ Ж
# контейнері (рішення №32), тобто спільна ФС тут є і сокет був би
# можливий — але TCP однорідний з усім іншим у стеку (рішення №9), а
# loopback робить сканер недосяжним для решті мережі групи.
#
# Саме тому тут 127.0.0.1, а не ім'я: це ОДИН мережевий стек, той самий
# погоджений виняток, що для пари postfix+dovecot (рішення №11).
TCPSocket 3310
TCPAddr 127.0.0.1

# ┌───────────────────────────────────────────────────────────────────┐
# │ ConcurrentDatabaseReload no — ОБОВ'ЯЗКОВО, не оптимізація.        │
# │                                                                   │
# │ Дефолт `yes` тримає в пам'яті ДВІ копії бази вірусів під час      │
# │ оновлення, щоб не зупиняти сканування. База — близько гігабайта,  │
# │ отже пікове споживання подвоюється. А clamd у нас на ГРУПУ        │
# │ (рішення №32: спільний на хост суперечив би ізоляції й зламався   │
# │ б при рознесенні груп на різні машини), тобто на хості з двома    │
# │ групами це різниця між ~2 і ~5 ГБ піків.                         │
# │                                                                   │
# │ Ціна: під час reload (раз на кілька годин, секунди) сканування    │
# │ чекає. Для пошти це невидимо.                                     │
# └───────────────────────────────────────────────────────────────────┘
ConcurrentDatabaseReload no

# Перечитувати базу, коли freshclam її оновив. 600 с — дефолт; freshclam
# у цьому ж контейнері, тож затримка між завантаженням і застосуванням
# у найгіршому випадку 10 хвилин.
SelfCheck 600

# ── Межі сканування ───────────────────────────────────────────────────
# Поштовий потік — архіви й вкладення, тож розпакування потрібне.
ScanArchive yes
ScanMail yes
ScanPE yes
ScanOLE2 yes
ScanPDF yes
ScanHTML yes

# MaxFileSize мусить бути НЕ МЕНШЕ за message_size_limit Postfix,
# інакше великий лист проходить НЕПЕРЕВІРЕНИМ, і це не видно в логах як
# помилка. Postfix дефолтом 10 МБ; тут із запасом.
MaxFileSize 50M
MaxScanSize 200M
MaxRecursion 16
MaxFiles 10000

# Архів, який не вдалось розпакувати до кінця (бомба, пароль), —
# позначати як підозрілий, а не пропускати: мілтер вирішить, що з ним
# робити, за OnInfected.
AlertEncrypted yes
AlertEncryptedArchive yes
AlertBrokenExecutables yes
