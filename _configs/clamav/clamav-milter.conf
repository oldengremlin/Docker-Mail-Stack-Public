# ─────────────────────────────────────────────────────────────────────
#  clamav-milter — підключення ClamAV до Postfix (рішення №32).
#
#  Мілтер, а не clamsmtpd, яким це зроблено на джерелах. Причина:
#  content_filter спрацьовує ПІСЛЯ прийому листа, тобто відмовити
#  відправнику вже неможливо — лишається тихо викинути або згенерувати
#  bounce на (ймовірно підроблену) зворотну адресу, тобто backscatter.
#  Мілтер працює під час SMTP-сесії й відмовляє тому, хто справді
#  надіслав.
# ─────────────────────────────────────────────────────────────────────

LogSyslog no
LogTime yes
LogVerbose no
Foreground yes

PidFile /run/clamav/clamav-milter.pid
User clamav

# Слухаємо на всіх адресах контейнера: Postfix живе в іншому контейнері
# й ходить сюди за іменем через internal-мережу групи.
MilterSocket inet:7357
FixStaleSocket yes

# clamd — у цьому ж контейнері, тому loopback (див. clamd.conf).
ClamdSocket tcp:127.0.0.1:3310

# Окремий від clamd ліміт: цей обмежує, що мілтер узагалі ПЕРЕДАСТЬ на
# сканування. Дефолт (100 МБ) підходить, але задаємо явно — тут тиха
# помилка означає непросканований лист, а не видиму відмову. Мусить
# бути ≥ message_size_limit у Postfix, як і MaxFileSize у clamd.
MaxFileSize 100M

# ┌───────────────────────────────────────────────────────────────────┐
# │ OnInfected Reject — і це головна причина існування цього файлу.  │
# │                                                                   │
# │ Дефолт — Quarantine, тобто лист приймається й складається вбік.   │
# │ На джерелах саме так (clamsmtpd із `Quarantine: on`), і тека      │
# │ /var/spool/clamstmp там НІКОЛИ не чиститься — одна з причин       │
# │ відмовитись від цієї схеми.                                       │
# │                                                                   │
# │ Reject під час SMTP-сесії: відправник отримує 5xx і дізнається    │
# │ сам, у нас нічого не накопичується, backscatter неможливий.       │
# │                                                                   │
# │ Це НЕ суперечить рішенню №21 («спершу лише маркування»): воно про │
# │ АНТИСПАМ, де ціна помилки — втрачений лист живої людини. Вірус    │
# │ хибно не спрацьовує, і абонент, чия машина його розсилає, мусить  │
# │ про це дізнатись, а не слати в тишу.                              │
# └───────────────────────────────────────────────────────────────────┘
OnInfected Reject
RejectMsg "Message rejected: virus or malware detected (%v)"

# Лист, який НЕ вдалось просканувати (clamd лежить, таймаут), —
# затримати, а не пропустити. Відправник повторить, і лист дійде
# перевіреним. Протилежний вибір у Postfix (milter_default_action =
# accept) стосується іншого випадку: мілтер не відповів ВЗАГАЛІ.
OnFail Defer

# Заголовок про результат сканування. Replace, а не Add: інакше лист,
# що пройшов через два наші сервери, отримав би два заголовки, і
# незрозуміло, котрий із них актуальний.
AddHeader Replace
