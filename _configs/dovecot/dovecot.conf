# ─────────────────────────────────────────────────────────────────────
#  Dovecot 2.4 — ПОВНИЙ конфіг групи, без !include conf.d/*.conf
#
#  Рішення №26: усе наше й детерміноване. Пакетні conf.d/* лишаються в
#  образі невикористаними. Ціна — при мажорному оновленні Dovecot цей
#  файл переглядається свідомо; виграш — нові дефолти не починають діяти
#  мовчки.
#
#  Шаблон монтує теку групи в /etc/dovecot/custom:ro, а entrypoint
#  КОПІЮЄ цей файл у /etc/dovecot/dovecot.conf, поверх пакетного.
#  Не заради естетики: `doveadm` і `doveconf` без -c читають саме
#  канонічний шлях, і якби наш конфіг лишався тільки в custom/, то
#  кожна діагностична команда працювала б із пакетним конфігом — з
#  іншою БД, іншим namespace, іншим mail_path — і відповідала б
#  упевнено й неправильно. Рішення №26 від цього не страдає: пакетний
#  файл включає conf.d/*, наш не включає нічого.
#
#  Синтаксис 2.4 несумісний з 2.3 (рішення №2). Головне, що змінилось:
#    mail_location          -> mail_driver + mail_path
#    passdb { driver = sql} -> passdb sql { }
#    password_query         -> query
#    dovecot-sql.conf.ext   -> іменований блок `mysql <host> { }`
#    disable_plaintext_auth -> auth_allow_cleartext (ІНВЕРТОВАНО)
#    default_pass_scheme    -> default_password_scheme (у passdb sql)
#    ssl_cert = </path      -> ssl_server { cert_file = /path }
#    protocols = imap pop3  -> блок protocols { imap = yes }
#    mail_plugins = sieve   -> блок mail_plugins { sieve = yes }
#    inet_listener { address }  -> inet_listener { listen }
# ─────────────────────────────────────────────────────────────────────

# Декларація семантики конфігу. Без неї 2.4 вважає конфіг успадкованим
# і вмикає сумісність із 2.3 — тобто частину дефолтів зі старими
# значеннями. Нам потрібні саме нові.
dovecot_config_version  = 2.4.0
dovecot_storage_version = 2.4.0

# ── Згенерована частина ───────────────────────────────────────────────
# Пише entrypoint з env. Там те, чого в репозиторії бути не може
# (пароль до БД) або що є параметром групи (uid/gid власника скриньок,
# адреси для listen, FQDN). Повний перелік ключів — у самому entrypoint.
#
# УВАГА: нічого з переліченого в generated.conf НЕ задавати нижче в
# цьому файлі. Dovecot для скалярів бере останнє значення, і
# перевизначення тут мовчки переб'є те, що прийшло з env.
!include /etc/dovecot/generated.conf

# ── Протоколи ─────────────────────────────────────────────────────────
# sieve тут — це ManageSieve (порт 4190), а не sieve-фільтрація: та
# вмикається плагіном у protocol lmtp нижче.
protocols {
  imap  = yes
  pop3  = yes
  lmtp  = yes
  sieve = yes
}

# ── Розкладка скриньок ────────────────────────────────────────────────
# Рішення №8: Maildir, /var/mail/<домен>/<localpart>.
#
# mail_path = %{home}, а home приходить із userdb (стовпець userdb_home
# подання usersdb, обчислений із домену й логіна). Саме так, а не
# сталою на кшталт maildir:/var/mail/%{user|domain}/%{user|username}:
# друга форма працює лише там, де логін дорівнює email, і на групі
# isp-типу дала б /var/mail//eml_user.
#
# mail_home СВІДОМО не задаємо: якщо userdb не повернув home, хай
# Dovecot скаже про це помилкою, а не складає пошту в непередбачуване
# місце.
mail_driver = maildir
mail_path   = %{home}

# ── Namespace ─────────────────────────────────────────────────────────
#  ╔═══════════════════════════════════════════════════════════════════╗
#  ║ ЦЕ НЕ ПЛЕЙСХОЛДЕР І НЕ ДОВІЛЬНЕ ЗНАЧЕННЯ. prefix і separator      ║
#  ║ МУСЯТЬ збігатися з тим, що віддає ЧИННИЙ сервер групи.            ║
#  ║                                                                   ║
#  ║ На диску Maildir++ виглядає однаково (`.Тека`, `.Тека.Підтека`)   ║
#  ║ при будь-якому prefix — різниця лише в іменах, які БАЧИТЬ клієнт. ║
#  ║ Помилка тут не ламає нічого видимого на старті: пошта ходить,     ║
#  ║ скриньки відкриваються, а от підписки на теки й усі sieve-правила ║
#  ║ з `fileinto "INBOX.Щось"` перестають знаходити теку — тихо.       ║
#  ║                                                                   ║
#  ║ Перевіряти на джерелі ПЕРЕД міграцією групи:                      ║
#  ║   doveconf -n namespace                                           ║
#  ║ Порожній prefix (як тут) — це дефолт Dovecot. Звірено на всіх      ║
#  ║ трьох джерелах: порожній і на office (2026-11-21).                ║
#  ║                                                                   ║
#  ║ Тут раніше стояло «на office prefix = INBOX.» — це був ЗДОГАД із   ║
#  ║ того, що 73 правила office звертаються до `INBOX.Foo.Bar`, і він   ║
#  ║ хибний: при ПОРОЖНЬОМУ префіксі таке ім'я теж розкривається, бо    ║
#  ║ в Maildir++ INBOX і є коренем, а `INBOX.Foo` — тека `.Foo` на      ║
#  ║ диску. Тобто з правил префікс не виводиться взагалі, і групового   ║
#  ║ параметра тут не потрібно.                                        ║
#  ╚═══════════════════════════════════════════════════════════════════╝
namespace inbox {
  type      = private
  inbox     = yes
  separator = .
  prefix    =

  # special_use дає клієнтам (Thunderbird, Outlook, Roundcube) зрозуміти
  # призначення теки без здогадок за іменем.
  #
  # auto тут ТІЛЬКИ на Junk, і це свідомо. Скриньки приїжджають із
  # джерела разом зі своїм набором тек, і auto-створення поруч дало б
  # дублікати («Sent» коло наявної «Відправлені»). Junk — виняток:
  # на нього спирається і донавчання антиспаму, і sieve-правила, а
  # :create у скриптах джерел не використовується НІДЕ (TODO 5c), тож
  # якщо теки немає, fileinto провалюється і лист падає в INBOX.
  mailbox Junk {
    auto        = subscribe
    special_use = \Junk

    # Переклали лист СЮДИ -> вчимо як спам (рішення №34). Блок стоїть
    # усередині mailbox, бо подія привязана саме до цієї теки;
    # зворотний напрямок задається `imapsieve_from Junk` нижче — це
    # ОКРЕМИЙ блок, а не поле тут (у 2.4 немає `from` серед полів
    # sieve_script; звірено з пакетним conf.d/90-sieve.conf).
    #
    # cause = copy: саме його використовує пакетний приклад. Перелік
    # можливих значень узятий із бінарника плагіна
    # (lib95_imap_sieve_plugin.so): APPEND, COPY, FLAG, MOVE. Якщо
    # жива перевірка покаже, що MOVE клієнта не спрацьовує через copy —
    # додати `move`, а не вгадувати заздалегідь (TODO п.5).
    sieve_script report-spam {
      type  = before
      cause = copy
      path  = /etc/dovecot/sieve/report-spam.sieve
    }
  }
  mailbox Sent {
    special_use = \Sent
  }
  mailbox Drafts {
    special_use = \Drafts
  }
  mailbox Trash {
    special_use = \Trash
  }
}

# ── Автентифікація ────────────────────────────────────────────────────
# Рішення №14: лише PLAIN і LOGIN, під TLS. Їх підтримують усі клієнти
# (Thunderbird, Outlook, The Bat, fetchmail), і сервер звіряє надісланий
# пароль із будь-якою схемою зберігання, бо хешує отримане й порівнює.
#
# CRAM-MD5 і DIGEST-MD5 НЕ оголошуємо: вони challenge-response, тобто
# вимагають, щоб сервер мав або відкритий пароль, або саме
# {CRAM-MD5}-похідну. Там, де в базі лежать CRYPT-хеші, оголошений
# CRAM-MD5 дає відмову БЕЗ фолбеку тому клієнту, який його обере —
# симптом «у когось працює, у когось ні». У 2.4 їх немає й у дефолті.
#
# {CRAM-MD5} у базі від цього не ламається (рішення №7): схема
# обчислюється з відкритого пароля детерміновано, тож Dovecot візьме
# пароль із PLAIN-сесії й порівняє похідні.
auth_mechanisms = plain login

# `auth_allow_cleartext` ТУТ НЕ ЗАДАЄТЬСЯ — він у generated.conf, бо це
# параметр групи (CLEARTEXT_NETWORKS). Дефолт — `no`, тобто рішення
# №14 діє й без нього.
#
# ЦЕЙ РЯДОК ТУТ СТОЯВ, і його прибрано не з гігієни. `!include
# generated.conf` робиться ВИЩЕ (рядок ~45), а Dovecot для скалярів
# бере послідне значення — отже літерал `no` тут затирав би глобальне
# `yes`, яке приходить із `CLEARTEXT_NETWORKS=any`. Для remote-блоків
# це не було видно: умовна секція перебиває глобальне значення
# незалежно від порядку файлів. Симптом був би найгіршого роду — `any`
# у group.env стоїть, конфіг валідний, абоненти не заходять.
#
# У 2.4 параметр ІНШИЙ, ніж у 2.3: був `disable_plaintext_auth = yes`,
# став `auth_allow_cleartext` з інвертованим змістом.
#
# Ціна рішення №14 при `no`: на 110/143 обов'язковий STARTTLS, клієнт
# на голому 110 зламається — свідомо. Коли група не може собі цього
# дозволити (isp: 312 абонентів, усі активні ходять POP3 без TLS),
# ставиться CLEARTEXT_NETWORKS — список мереж або слово `any`.

# ── Схеми паролів, що приїхали з джерел ───────────────────────────────
#  ╔═══════════════════════════════════════════════════════════════════╗
#  ║ auth_allow_weak_schemes З'ЯВИВСЯ В 2.4 І ДЕФОЛТОМ `no`.           ║
#  ║ Під забороною MD-схеми (крім DIGEST-MD5 і CRAM-MD5), LANMAN,      ║
#  ║ NTLM і подібні — тобто MD5-CRYPT ($1$) і DES-CRYPT.               ║
#  ║ НЕ зачеплені: PLAIN (і будь-який явний cleartext), CRAM-MD5.      ║
#  ║                                                                   ║
#  ║ Що це означає по групах (розклад — SOURCES):                      ║
#  ║   small : {CRAM-MD5} + {PLAIN}            -> прапорець НЕ потрібен║
#  ║   office: ~107 DES-CRYPT                  -> ПОТРІБЕН             ║
#  ║   isp : 167 MD5-CRYPT + 95 DES-CRYPT    -> ПОТРІБЕН             ║
#  ║                                                                   ║
#  ║ Без прапорця ці користувачі не автентикуються взагалі, і в лозі   ║
#  ║ буде не «wrong password», а відмова схеми. Розкомментувати при     ║
#  ║ міграції office/isp:                                            ║
#  ╚═══════════════════════════════════════════════════════════════════╝
#auth_allow_weak_schemes = yes

# ── passdb / userdb ───────────────────────────────────────────────────
#  ╔═══════════════════════════════════════════════════════════════════╗
#  ║ ЦЕЙ БЛОК ПРИВ'ЯЗАНИЙ ДО DB_SCHEMA=mysql-mail.                     ║
#  ║ Імена подання `usersdb` і його стовпців — контракт зі схемою       ║
#  ║ (_schemas/mysql-mail/01-schema.sql), а не довільні назви. Групі    ║
#  ║ на PostgreSQL-варіанті цей блок треба замінити цілком, разом із    ║
#  ║ sql_driver.                                                       ║
#  ╚═══════════════════════════════════════════════════════════════════╝
# Сам блок підключення (`mysql mysql { ... }`) — у generated.conf: там
# пароль.
sql_driver = mysql

passdb sql {
  # Рішення №16: ARGON2ID для НОВИХ паролів. На наявні не впливає —
  # кожен рядок у базі має явний префікс {СХЕМА} (рішення №25), а він
  # перебиває цей дефолт. Тобто параметр діє рівно на те, що задано
  # вже в новому стеку.
  default_password_scheme = ARGON2ID

  # Рішення №15: вхід і за повним email, і за коротким логіном.
  #
  # Матч ЗА ДВОМА СТОВПЦЯМИ, а не за localpart: короткий логін на
  # джерелах не пов'язаний з адресою (на isp 240 із 312, на office
  # 207 із 247 не збігаються), тож вивести його з email неможливо — він
  # мусить лежати окремим стовпцем. У `usersdb` він є, і там же фолбек
  # на email, тому ця гілка нешкідлива в групах, де короткого логіна
  # немає: обидва порівняння дадуть той самий рядок.
  #
  # Колізій між гілками не буває за побудовою: `user` у поданні завжди
  # містить '@', а короткий логін — ніколи. Колізія можлива ІНША, між
  # логіном одного й адресою іншого (на office такий випадок є:
  # login='office' при скриньці account@, тоді як office@ має логін
  # 'ofice'). Ловити це мусить конвертор міграції — запит у шапці
  # _schemas/mysql-mail/01-schema.sql.
  #
  # `user AS username` тут не косметика: Dovecot бере username із
  # РЕЗУЛЬТАТУ, тож вхід коротким логіном нормалізується до повної
  # адреси, і далі всі %{user} — адреса. Саме на це спираються per-user
  # prefs SpamAssassin (рішення №31), ключ bayes при донавчанні
  # (рішення №34) і sauserprefs у вебмейлі.
  query = SELECT `user` AS username, `password` \
            FROM usersdb \
           WHERE `user`  = '%{user | lower}' \
              OR `login` = '%{user | lower}'
}

userdb sql {
  # home рахується у в'ю, Dovecot бере готовим (рішення №8).
  # uid/gid НЕ звідси, а з mail_uid/mail_gid у generated.conf: вони
  # однакові на всю групу, але РІЗНІ між групами (small 8, office 5000).
  # Та сама пара ключів, що в passdb. Після успішної автентифікації
  # Dovecot уже підставив би нормалізовану адресу, але userdb викликають
  # і без passdb — `doveadm user <логін>`, LMTP, перевірка квоти, — і
  # там коротка форма мусить працювати так само.
  query = SELECT userdb_home AS home \
            FROM usersdb \
           WHERE `user`  = '%{user | lower}' \
              OR `login` = '%{user | lower}'

  # Потрібен для `doveadm -A` — масових операцій по всіх скриньках
  # (донавчання антиспаму, перевірка sieve, конвертації). Без нього
  # `doveadm -A` просто не має списку користувачів.
  iterate_query = SELECT `user` AS username FROM usersdb
}

# ── Сервіси ───────────────────────────────────────────────────────────
# Рішення №11: LMTP і SASL-auth — на 127.0.0.1. Postfix і Dovecot
# ділять network namespace (`network_mode: service:postfix`), тобто це
# один мережевий стек, і loopback тут не виняток із правила «тільки за
# іменами», а точний опис зв'язку. Виграш конкретний: ці два порти не
# видно решті internal-мережі, включно з гостем-проксі.
#
# Глобальний `listen` (у generated.conf) перелічує ЗОВНІШНІ адреси
# групи плюс 127.0.0.1 — звідси беруть адресу всі inet_listener'и, що
# не задали власну. Тому lmtp і auth свою задають явно.

service lmtp {
  inet_listener lmtp {
    # УВАГА: у 2.4 це `listen`, а НЕ `address` (як було в 2.3). Повне
    # ім'я параметра — `inet_listener_listen`, і саме його upgrade-guide
    # називає заміною старого `address`. Помилка помітна одразу:
    # «Unknown setting: address (inet_listener_address ... not found)».
    listen = 127.0.0.1
    # Порт 24 — стандартний LMTP. Мусить збігатися з
    # virtual_transport = lmtp:inet:127.0.0.1:24 у main.cf.
    port = 24
  }
}

service auth {
  # Ім'я слухача (`auth_inet`) ДОВІЛЬНЕ — на нього ніхто не
  # посилається. А ось порт — ні: він мусить збігатися з
  # smtpd_sasl_path = inet:127.0.0.1:12345 у main.cf.
  inet_listener auth_inet {
    listen = 127.0.0.1          # 2.4: listen, не address — див. lmtp вище
    port   = 12345
  }
}

service managesieve-login {
  # Пастка в дефолтах 2.4: пакетний конфіг тримає ДРУГИЙ слухач
  # ManageSieve на порту 2000 (`sieve_deprecated`). На білій адресі
  # групи це зайвий відкритий порт, якого ніхто не просив.
  # port = 0 вимикає слухача.
  inet_listener sieve_deprecated {
    port = 0
  }
}

# ── Доставка через LMTP ───────────────────────────────────────────────
# Роздільник адрес — ТОЙ САМИЙ, що в main.cf Postfix, і це не
# косметика. Postfix відкидає `+мітка` при пошуку скриньки й приймає
# лист; якщо Dovecot роздільника не знає, userdb шукає `user+мітка@`
# буквально, не знаходить і відмовляє — тобто відмова приходить ПІСЛЯ
# прийому листа. Два значення мусять збігатися або не стояти обидва.
recipient_delimiter = +

protocol lmtp {
  # Пастка в дефолтах 2.4: тут auth_username_format дефолтом
  # `%{user | username | lower}`, тобто ВІДРІЗАЄ домен. Для нас це
  # неприйнятно: доставка йде на повну адресу, на ній тримається
  # рішення №15 і запит userdb вище. З обрізаним доменом скринька
  # просто не знаходиться, а в лозі лишається тільки «user unknown».
  auth_username_format = %{user | lower}

  # Той самий дефект, що знайшовся на isp: там sieve підключений до
  # lda, а доставка йде через lmtp — тобто фільтри не працювали б, якби
  # хтось ними користувався. Плагін вішаємо саме на транспорт доставки.
  mail_plugins {
    sieve = yes
  }
}

# ── Sieve ─────────────────────────────────────────────────────────────
# У 2.4 переписано цілком: замість
# `sieve = file:~/sieve;active=~/.dovecot.sieve` — іменовані блоки.
#
# Шляхи саме такі, як на джерелах: активний скрипт — симлінк
# ~/.dovecot.sieve на один із файлів у ~/sieve/, а сам він зазвичай
# набір `include :personal` на кілька файлів (на office — 41 скрипт у
# 13 користувачів). `~` — це home із userdb, тобто
# /var/mail/<домен>/<localpart>: скрипти лежать у тому самому томі, що
# й пошта, і окремого тому під них немає свідомо.
# `active_path` НЕ в корені home, і це не стиль.
#
# `mail_path = %{home}` (рішення №8) означає, що Maildir лежить просто
# в home, а теки Maildir++ — це каталоги з ПРОВІДНОЮ ТОЧКОЮ. Пакетна
# конвенція `~/.dovecot.sieve` потрапляє рівно в цей простір імен, і
# Dovecot показує її клієнтові як теку. Перевірено справжнім IMAP LIST
# на перенесених даних:
#
#   * LIST (\Noselect \HasChildren) "." dovecot
#   * LIST (\HasNoChildren) "." dovecot.sieve
#
# `dovecot` з'явився як батьківський вузол, бо separator — крапка.
# Roundcube їх не показує (він слухає підписки), а Thunderbird у
# «Підписках» покаже. Плюс у лог сипле
# `maildir: stat(.../.dovecot.sieve/tmp) failed: Not a directory`.
#
# Ім'я саме `.active`, а НЕ `.dovecot.sieve`: file-драйвер Pigeonhole
# перелічує в цьому каталозі `*.sieve`, тож активний симлінк із таким
# іменем став би ще й «скриптом». `.svbin` лягає поруч
# (`~/sieve/.active.svbin`) і теж нікому не мішає.
#
# МІГРАЦІЯ: наявні `~/.dovecot.sieve` — ВІДНОСНІ симлінки виду
# `sieve/forward.sieve`, тож переносити їх не можна, треба переписати
# ціль (ROADMAP, крок 15b).
sieve_script personal {
  driver      = file
  path        = ~/sieve
  active_path = ~/sieve/.active
}

# ── Канал відправки для redirect і vacation ───────────────────────────
# Dovecot віддає `redirect` (і автовідповідь `vacation`) НЕ сам: він
# передає лист назовні. Дефолт — `sendmail_path = /usr/sbin/sendmail`,
# і в цьому образі такого файла НЕМАЄ (перевірено: Postfix тут не
# встановлений). Без цього параметра redirect мовчки не відбувається —
# а саме на ньому тримається перенесення зовнішніх аліасів у sieve.
#
# `127.0.0.1:25` — узгоджений виняток із правила «тільки за іменами»
# (рішення №11): dovecot ділить network namespace з postfix, тобто це
# один мережевий стек. Два наслідки, обидва на нашу користь:
#   * `127.0.0.0/8` уже в `mynetworks` (його ставить entrypoint
#     postfix безумовно), тож isp на зовнішні адреси дозволений;
#   * `postscreen_access_list = permit_mynetworks` — дефолт, тобто
#     шестисекундний greet-тест цю пошту не затримує.
submission_host = 127.0.0.1:25

# ── Відправник пересланого листа ──────────────────────────────────────
# ЗАРАДИ ЦЬОГО РЯДКА зовнішнє пересилання й переїхало з `aliases` у
# sieve. Аліас переписує ОТРИМУВАЧА, лишаючи MAIL FROM чужим: Gmail
# перевіряє SPF чужого домену проти НАШОЇ адреси й законно відмовляє.
# redirect робить Dovecot, і тут можна поставити у MAIL FROM свою
# адресу — тоді SPF звіряється з нашим доменом і сходиться.
#
# `recipient` — адреса, на яку лист прийшов. Для скриньки-носія це
# рівно та адреса, що раніше була аліасом; для правила, яке користувач
# напише собі сам, — його власна. Значення звірене з бінарника
# (libdovecot-sieve: таблиця поруч із `postmaster`), а НЕ з пам'яті:
# параметр приймає рядок, і помилка вилізла б аж при доставці листа
# (`sieve_redirect_envelope_from: Invalid address source`).
#
# ЧОМУ НЕ `postmaster`: параметр ГЛОБАЛЬНИЙ, тобто діє й на
# користувацькі скрипти, а там баунс пішов би чужій людині.
#
# ЦІНА, і її треба знати: баунс від приймальної сторони тепер приходить
# на адресу-носія, куди ніхто не заходить. Поруч із ним там лежить
# копія оригіналу (`redirect :copy`), тож місце для діагностики одне й
# те саме — але заглядати туди треба свідомо.
#
# DMARC це НЕ лагодить і не мало: alignment звіряється з `From:`, який
# лишається чужим. Повне рішення — ARC (TODO).
sieve_redirect_envelope_from = recipient

# sieve_max_redirects тут НЕМА навмисно — він приходить із env
# (SIEVE_MAX_REDIRECTS у group.env) через generated.conf, бо носії
# пересилання впираються в нього по-різному залежно від групи.
# Задати його ще й тут означало б два джерела одного значення.

# ── Донавчання антиспаму (рішення №34) ────────────────────────────────
# Користувач переклав лист у .Junk — учимо як спам; витяг назад —
# як ham. Навчає НЕ цей контейнер: `spamc-learn` із
# sieve_pipe_bin_dir шле лист у spamd сусіднього контейнера. Тут немає
# ні SpamAssassin, ні доступу до його бази стану, і це свідомо
# (рішення №33 симетрично).
#
# Увесь синтаксис нижче звірений із ПАКЕТНИМ conf.d/90-sieve.conf у
# цьому ж образі, а не з документації в інтернеті: у 2.4 pigeonhole
# влитий у ядро Dovecot, тож окремий апстрім-репо лишився на лінії 2.3
# і описує `imapsieve_mailbox1_*`, яких більше немає (PITFALLS).
protocol imap {
  mail_plugins {
    imap_sieve = yes
  }
}

# Рядком, не блоком — так у пакетному прикладі, і так приймає парсер.
sieve_plugins = sieve_imapsieve sieve_extprograms

# ┌───────────────────────────────────────────────────────────────────┐
# │ sieve_global_extensions — це ОБМЕЖЕННЯ, а не просто «увімкнути».  │
# │                                                                   │
# │ Словами пакетного конфігу: «the extensions enabled with this      │
# │ setting are never available to the user's personal script no      │
# │ matter what is specified for the sieve_extensions setting».       │
# │                                                                   │
# │ Тобто vnd.dovecot.pipe доступний ЛИШЕ адміністраторським          │
# │ скриптам. Інакше будь-який користувач міг би зі свого особистого  │
# │ скрипта викликати будь-яку програму з sieve_pipe_bin_dir.         │
# │ Поставити це в sieve_extensions було б дірою.                     │
# └───────────────────────────────────────────────────────────────────┘
# САМ БЛОК — У generated.conf, його емітує entrypoint: два джерела
# одного блоку розійшлись би МОВЧКИ (той самий урок, що з `ssl` і
# `auth_allow_cleartext`).

# Шлях ПАКЕТНИЙ, не довільний: саме його називає conf.d/90-sieve.conf.
# Entrypoint кладе туди `spamc-learn` із _configs/dovecot/sieve-pipe/.
# Імена програм у pipe не можуть містити «/» — тільки файл у цьому
# каталозі.
sieve_pipe_bin_dir = /usr/share/dovecot-pigeonhole/sieve

# Зворотний напрямок: лист ПОКИНУВ Junk. Подія тут — поява листа в
# іншій теці, а умова — що він прийшов саме з Junk, тому це окремий
# блок верхнього рівня, а не поле в mailbox Junk.
#
# УВАГА: тут фільтра на теку-ПРИЗНАЧЕННЯ немає й бути не може — блок
# знає лише джерело. А видалення листа в клієнті — це MOVE у Trash,
# тобто теж вихід із Junk, тобто теж `copy`. Через це чистка теки
# «Спам» навчала фільтр, що весь той спам легальний (виміряно на
# small: ham_count 14 -> 77 за одну чистку). Призначення перевіряє
# САМ скрипт через `environment "imap.mailbox"` — див.
# _configs/dovecot/report-ham.sieve і PITFALLS.
imapsieve_from Junk {
  sieve_script report-ham {
    type  = before
    cause = copy
    path  = /etc/dovecot/sieve/report-ham.sieve
  }
}

# ── TLS ───────────────────────────────────────────────────────────────
# ЗАГЛУШКА. Повноцінний TLS — TODO п.7 (certbot, deploy-hook, спільний
# том під сертифікати). Поки сертифікату немає, entrypoint генерує
# самопідписаний і гучно про це пише в лог, інакше Dovecot не стартує
# взагалі: auth_allow_cleartext = no без TLS означає, що увійти не може
# ніхто.
#
# Шляхи мусять збігатися з тим, що пише entrypoint.
# ssl ТУТ НЕ ЗАДАЄТЬСЯ — він у generated.conf, бо виводиться з
# CLEARTEXT_NETWORKS групи. Dovecot 2.4 падає, якщо дозволити пароль
# без TLS і водночас вимагати TLS, тож обидва параметри мусять мати
# ОДНЕ джерело. Літерал тут затирав би згенерований: !include стоїть
# вище, а для скалярів виграє останнє значення.
ssl_server {
  cert_file = /etc/dovecot/tls/fullchain.pem
  key_file  = /etc/dovecot/tls/privkey.pem
}
# TLS 1.2 як мінімум. Якщо якийсь зі старих клієнтів (The Bat, старий
# Outlook) не зайде — це перший параметр, на який дивитись, і свідоме
# рішення, а не недогляд.
ssl_min_protocol = TLSv1.2

# ── Логи ──────────────────────────────────────────────────────────────
# У контейнері syslog-у немає, тож пишемо в stderr — його збирає
# `docker logs` / `mailctl logs`.
log_path = /dev/stderr
auth_verbose = yes

# ── Чого тут свідомо НЕМА ─────────────────────────────────────────────
#  * quota. Стовпець `quota` у схемі є, але на джерелах квоти не
#    працюють (`90-quota.conf` з порожніми блоками), тобто стовпець
#    декоративний. Вмикати їх — зміна поведінки для живих користувачів,
#    і це окреме питання до власника, а не побічний ефект міграції.
#  * sieve_extensions. Набір потрібних розширень відомий (fileinto,
#    copy, regex, imap4flags, duplicate, include, reject, body), але
#    задавати блок навмання небезпечно: якщо він ЗАМІНЮЄ дефолтний
#    набір, а не додає до нього, скрипти зламаються всі одночасно.
#    Спершу звірити на зібраному образі (`doveconf sieve_extensions`),
#    потім дописувати лише те, чого бракує.
#  * глобальний sieve (`sieve_before`/`type = before`). Потрібен для
#    донавчання антиспаму, але сам механізм ще не обраний (TODO п.5).
#  * login_trusted_networks. Згадувався як обхід для офісних клієнтів,
#    що ходять на IP, а не на ім'я з сертифіката. Рішення власника —
#    сертифікат на ІМ'Я, а виняток затверджує людина, тож обхід не
#    потрібен.
