# ─────────────────────────────────────────────────────────────
#  Спільний фронт-проксі на весь хост. ОКРЕМИЙ compose-проєкт,
#  НЕ частина поштового стека групи. Піднімати через:
#
#    ./mailctl proxy up
#
#  Один nginx обслуговує webmail усіх груп і маршрутизує за Host:
#  у Roundcube потрібної групи. Групи про нього нічого не знають —
#  у _template/docker-compose.yml його немає й бути не повинно.
#
#  ── ЦЕЙ ФАЙЛ РУКАМИ НЕ РЕДАГУЄТЬСЯ ПРИ ДОДАВАННІ ГРУП ────────
#  Підключення до мереж груп живуть окремими фрагментами в
#  groups.d/<GROUP_NAME>.yml і домержуються Compose-ом (-f base -f
#  фрагменти). Фрагмент генерується з group.env групи:
#
#    ./mailctl proxy attach <group>     # створити фрагмент
#    ./mailctl proxy detach <group>     # прибрати
#
#  Раніше кожна група вписувалась сюди двома блоками в двох різних
#  місцях файлу — з ідентичними маркерами й різними відступами. При
#  одній групі це терпимо, при трьох перетворюється на джерело
#  помилок, тому й винесено у фрагменти.
#
#  vhost-и ГЕНЕРУЮТЬСЯ: `mailctl proxy attach <group>` кладе в
#  nginx-config/conf.d/<GROUP_NAME>.conf, бо всі три його плейсхолдери
#  (мітка upstream, INTERNAL_PREFIX, WEBMAIL_FQDN) механічно виводяться
#  з group.env. Файл НЕ перезаписується, якщо вже є — своє в групи
#  правиться на місці. Приклад для читання лишився в
#  nginx-config/conf.d/group.conf.example.
#
#  Сертифікат вебмейлу — ХОСТОВИЙ (на WEBMAIL_FQDN), не груповий, і
#  видається через --webroot у ./acme-webroot. Групові поштові
#  сертифікати до цього тому не стосуються: вони живуть у томі
#  tls-certs своєї групи (TODO.md, п.7).
# ─────────────────────────────────────────────────────────────

networks:
  # власна мережа проксі — тут поки нікого, крім самого nginx, але вона
  # потрібна як "домашня": без неї єдиними мережами контейнера були б
  # чужі group-мережі, і будь-яка з них могла б стати дефолтним шлюзом.
  # Назва довільна, використовується тільки всередині цього файлу.
  frontend:
    driver: bridge

  # Мережі поштових груп сюди НЕ вписуються — вони приходять
  # фрагментами з groups.d/ (див. шапку файлу). Кожен фрагмент оголошує
  # <GROUP_NAME>_internal як external і підключає до неї nginx.
  #
  # Це єдине місце, де щось ззовні групи має доступ у її internal —
  # погоджений виняток з ізоляції, не недогляд (TODO.md, п.8).

volumes:
  # Сертифікат вебмейлу (на WEBMAIL_FQDN кожної групи). Наповнює
  # certbot через --webroot: виклик лягає в ./acme-webroot, який nginx
  # віддає за /.well-known/acme-challenge/ у кожному vhost.
  # Том хостовий, не груповий, бо й ім'я хостове: вебмейл живе на
  # адресі проксі, а не на PUBLIC_IP групи.
  certs:

services:

  nginx:
    image: nginx:stable
    container_name: proxy-nginx   # довільне, ні з чим не пов'язане
    restart: unless-stopped
    # Єдиний контейнер на хості, що публікує 80/443 назовні. Білі IP
    # груп цих портів не займають: Roundcube з netns винесений, а
    # postfix/dovecot слухають свої поштові порти й :80/:443 не чіпають.
    # ┌─────────────────────────────────────────────────────────────┐
    # │ АДРЕСА ОБОВ'ЯЗКОВА. Без неї тут стояло "80:80"/"443:443",   │
    # │ тобто bind на 0.0.0.0 — на ВСІ адреси хоста.                │
    # │                                                             │
    # │ На полігоні це дало `Bind for 203.0.113.94:443 failed:     │
    # │ port is already allocated`: на тій машині, крім пошти, живуть│
    # │ ще два стеки зі своїми Caddy на .93 і .94. Тобто ми         │
    # │ намагались забрати порт у чужого сервісу, і врятувало лише  │
    # │ те, що він його вже тримав. На чистому хості ми б забрали   │
    # │ 80/443 на всіх адресах і дізнались про це від сусіда.       │
    # │                                                             │
    # │ PROXY_BIND генерує mailctl із proxy.bind у host.json — руками│
    # │ тут не задавати: файл комітиться в git, а адреса хостова.    │
    # │ Це НЕ адреса групи: вони ipvlan-слейви, і хост їх не бачить. │
    # └─────────────────────────────────────────────────────────────┘
    ports:
      - "${PROXY_BIND}:80:80"
      - "${PROXY_BIND}:443:443"
    networks:
      frontend:
      # Мережі груп домержуються фрагментами з groups.d/, разом зі
      # статичною адресою <INTERNAL_PREFIX>.100 у кожній. Адреса
      # статична свідомо: щоб можна було написати правило "у Roundcube
      # ходить тільки .100", а не гадати, що роздав Docker.
    volumes:
      - ./nginx-config/conf.d:/etc/nginx/conf.d:ro
      - ./acme-webroot:/var/www/acme:ro
      - certs:/etc/letsencrypt:ro

  # TODO: certbot. Свідомо не дописаний — не обрано ні challenge, ні хто
  # саме випускає сертифікати для поштових імен (їх треба postfix/dovecot
  # на білій IP групи, а не тут). Варіанти — TODO.md, п.7.
